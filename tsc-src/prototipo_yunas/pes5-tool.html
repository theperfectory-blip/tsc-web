<!-- MOVIDA AL PANEL ADMIN (slice 2.0-1): la Tool PES5 ahora es la seccion "Tool PES5" de index.html.
     Lógica en js/pes5-tool.js, estilos en css/pes5-tool.css, carga bajo demanda en js/pes5-admin.js.
     Este archivo queda solo como referencia hasta el slice 5 (limpieza de prototipo_yunas). No usar. -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool PES5</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/components.css">
<!-- Firebase (compat) — debe cargar antes de firebase-config.js / auth.js -->
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/state.js"></script>
<script src="../js/db.js"></script>
<script src="../js/events.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/pes5-crypt.js"></script>
<script src="../js/pes5-editor.js"></script>
<script src="../js/pes5-save.js"></script>
<!-- Slice D.R: mismas reglas de costo YunaCoins que usa el editor del presidente -->
<script src="../js/yunacoins-rules.js"></script>
<script src="../js/pes5-plantilla.js"></script>
<script src="../js/pes5-bloqueo.js"></script>
<style>
html,body{margin:0;background:var(--bg-deep);color:var(--txt);font-family:'Barlow',sans-serif;}
*{box-sizing:border-box;}
.icn{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.icn.lg{width:18px;height:18px;}

#ep-auth-status{position:fixed;top:14px;right:16px;font-size:12px;z-index:50;}
.gate{padding:60px 20px;text-align:center;color:var(--txt3);}
.gate .icn{width:32px;height:32px;margin-bottom:10px;color:var(--txt3);}

.pt-shell{max-width:1280px;margin:0 auto;padding:20px 16px 90px;}
.pt-h1{font-family:'Bebas Neue';font-size:26px;letter-spacing:0.5px;margin:0 0 2px;}
.pt-sub{color:var(--txt3);font-size:13px;margin-bottom:16px;}

/* ---------- barra de estado del save ---------- */
.pt-statusbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);
  border:1px solid var(--brd2);border-radius:var(--rl);padding:10px 14px;margin-bottom:16px;}
.pt-status-item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--txt2);}
.pt-status-item b{color:var(--txt);font-weight:600;}
.pt-status-sep{width:1px;align-self:stretch;background:var(--brd);}
.pt-status-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;}
.pt-dot{width:8px;height:8px;border-radius:50%;flex:none;}
.pt-dot.ok{background:var(--green);}
.pt-dot.off{background:var(--txt3);}
.pt-dot.warn{background:#F59E0B;}

/* ---------- tabs ---------- */
.pt-tabs{display:flex;gap:4px;border-bottom:1px solid var(--brd);margin-bottom:16px;overflow-x:auto;}
.pt-tab{display:flex;align-items:center;gap:6px;padding:9px 14px;background:none;border:none;
  border-bottom:2px solid transparent;color:var(--txt3);font-family:'Barlow Condensed';font-weight:700;
  font-size:14px;letter-spacing:0.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;flex:none;}
.pt-tab:hover{color:var(--txt);}
.pt-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.pt-tab .icn{width:14px;height:14px;}

/* ---------- equipos ---------- */
.pt-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.pt-search{flex:1;min-width:180px;max-width:320px;padding:7px 10px;background:var(--card2);
  border:1px solid var(--brd);border-radius:var(--r);color:var(--txt);font-size:13px;}
.pt-escudo{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--card3);flex:none;}
.pt-escudo-ph{width:26px;height:26px;border-radius:50%;background:var(--card3);display:flex;align-items:center;
  justify-content:center;color:var(--txt3);flex:none;}
.pt-cupo{font-family:'Barlow Condensed';font-weight:700;color:var(--txt2);}
.pt-cupo.full{color:var(--green);}

/* ---------- plantilla ---------- */
.pt-team-select-row{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.pt-team-select-row select{padding:8px 10px;background:var(--card2);border:1px solid var(--brd);
  border-radius:var(--r);color:var(--txt);font-size:13px;min-width:260px;}
.pt-grid{display:grid;grid-template-columns:1fr;gap:14px;}
.pt-panel-open .pt-grid{grid-template-columns:minmax(0,1fr) 320px;}
@media(max-width:900px){.pt-panel-open .pt-grid{grid-template-columns:1fr;}}

.pt-plantilla-table th{white-space:nowrap;}
.pt-plantilla-table td{white-space:nowrap;}
.pt-row-jugador{cursor:pointer;}
.pt-row-jugador.selected td{background:var(--gold-l);}
.pt-stat-cell{text-align:center;font-variant-numeric:tabular-nums;}
.pt-alsoin{display:inline-flex;align-items:center;gap:3px;margin-left:6px;}

/* ---------- panel lateral ---------- */
.pt-side{background:var(--card);border:1px solid var(--brd2);border-radius:var(--rl);padding:14px;
  display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow-y:auto;}
.pt-side-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.pt-side-hd h3{font-family:'Bebas Neue';font-size:19px;margin:0;letter-spacing:0.5px;}
.pt-side-close{background:none;border:none;color:var(--txt3);cursor:pointer;padding:2px;}
.pt-side-close:hover{color:var(--txt);}
.pt-side-sub{font-size:12px;color:var(--txt3);margin-top:-6px;}
.pt-fieldgrp{display:flex;flex-direction:column;gap:6px;}
.pt-fieldgrp-title{font-family:'Barlow Condensed';font-weight:700;font-size:12px;letter-spacing:1px;
  text-transform:uppercase;color:var(--txt3);margin:6px 0 2px;}
.pt-field{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;}
.pt-field label{color:var(--txt2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pt-field input[type=number]{width:56px;padding:3px 5px;background:var(--card2);border:1px solid var(--brd);
  border-radius:4px;color:var(--txt);font-size:12.5px;text-align:right;}
.pt-field input[type=number].changed{border-color:var(--gold);color:var(--gold);}
.pt-field select{padding:3px 5px;background:var(--card2);border:1px solid var(--brd);border-radius:4px;
  color:var(--txt);font-size:12.5px;}
.pt-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;}
.pt-toggle input{accent-color:var(--gold);width:14px;height:14px;}
.pt-chips{display:flex;flex-wrap:wrap;gap:4px;}
.pt-chip{font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--card2);border:1px solid var(--brd);
  color:var(--txt2);}
.pt-chip.active{background:var(--gold-l);border-color:var(--gold-b);color:var(--gold);}

.pt-writebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--brd);}
.pt-writebar label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--txt2);cursor:pointer;}
.pt-writebar input[type=checkbox]{accent-color:var(--gold);}
.pt-changes-count{font-size:12px;color:var(--gold);font-weight:600;}

/* ---------- cobro YunaCoins (Slice D.R) ---------- */
.pt-cobro{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:var(--r);background:var(--card2);
  border:1px solid var(--brd);}
.pt-cobro-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  letter-spacing:0.3px;padding:3px 9px;border-radius:999px;width:fit-content;}
.pt-cobro-badge.pagando{background:var(--gold-l);border:1px solid var(--gold-b);color:var(--gold);}
.pt-cobro-badge.libre{background:var(--card3);border:1px solid var(--brd);color:var(--txt2);}
.pt-cobro-badge .icn{width:12px;height:12px;}
.pt-cobro-lineas{display:flex;flex-direction:column;gap:2px;font-size:12px;}
.pt-cobro-line{display:flex;justify-content:space-between;gap:8px;color:var(--txt2);}
.pt-cobro-line b{color:var(--txt);font-weight:600;}
.pt-cobro-line .costo{font-family:'Bebas Neue';font-size:13px;color:var(--gold);white-space:nowrap;}
.pt-cobro-line .costo.gratis{color:var(--txt3);font-family:inherit;font-size:12px;}
.pt-cobro-total{display:flex;justify-content:space-between;align-items:center;padding-top:6px;
  border-top:1px solid var(--brd);font-size:12.5px;color:var(--txt2);}
.pt-cobro-total b{font-family:'Bebas Neue';font-size:18px;color:var(--gold);}
.pt-cobro-faltante{font-size:11.5px;color:#f87171;}

/* ---------- esqueletos (pedidos/publicar) ---------- */
.pt-empty{padding:50px 20px;text-align:center;color:var(--txt3);border:1px dashed var(--brd);border-radius:var(--rl);}
.pt-empty .icn{width:30px;height:30px;margin-bottom:8px;}

.pt-log{font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:220px;overflow:auto;
  background:var(--card2);border:1px solid var(--brd);border-radius:var(--r);padding:10px;margin-top:10px;}
.pt-log .ok{color:#4ade80;} .pt-log .err{color:#f87171;} .pt-log .warn{color:#facc15;}

/* ---------- paneles persistentes de error / exito de escritura (C2.3) ---------- */
.pt-panel-msg{display:flex;align-items:flex-start;gap:8px;margin-top:10px;padding:10px 12px;
  border-radius:var(--r);font-size:12.5px;line-height:1.5;}
.pt-panel-msg .icn{margin-top:1px;}
.pt-panel-msg-body{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;}
.pt-panel-msg-close{background:none;border:none;color:inherit;cursor:pointer;padding:2px;flex:none;opacity:0.8;}
.pt-panel-msg-close:hover{opacity:1;}
.pt-panel-err{background:rgba(248,113,113,0.1);border:1px solid #f87171;color:#f87171;}
.pt-panel-ok{background:rgba(74,222,128,0.1);border:1px solid #4ade80;color:#4ade80;}

/* ---------- fade horizontal + sin scrollbar visible (regla no-scroll del proyecto) ---------- */
.pt-tbl-wrap{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
  -webkit-mask-image:linear-gradient(to right, transparent, #000 14px, #000 calc(100% - 14px), transparent);
  mask-image:linear-gradient(to right, transparent, #000 14px, #000 calc(100% - 14px), transparent);}
.pt-tbl-wrap::-webkit-scrollbar{display:none;height:0;}
/* ================= Editor embebido (modal con mejoras.html en modo admin) ================= */
.pt-ed-overlay{position:fixed;inset:0;z-index:960;background:rgba(4,6,10,0.72);display:flex;align-items:center;justify-content:center;padding:16px;}
.pt-ed-box{width:min(1240px,100%);height:min(94vh,100%);background:var(--card);border:1px solid var(--brd2);border-radius:var(--rl);display:flex;flex-direction:column;overflow:hidden;}
.pt-ed-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-bottom:1px solid var(--brd);font-family:'Bebas Neue';font-size:19px;letter-spacing:0.5px;}
.pt-ed-close{background:none;border:none;color:var(--txt3);cursor:pointer;padding:4px;}
.pt-ed-close:hover{color:var(--txt);}
.pt-ed-frame{flex:1;width:100%;border:0;background:var(--card);}
.pt-cell-changed{color:var(--gold);font-weight:700;}
.pt-cobro-txt{font-size:12px;color:var(--txt2);}
.pt-hint-click{margin-top:8px;font-size:12px;color:var(--txt3);}
#pl-writebar{position:sticky;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--brd);padding:10px 14px;margin-top:10px;}
#pl-writebar:empty{display:none;}
#pl-writebar .pt-writebar{border-top:none;padding-top:0;}
</style>
</head>
<body>
<div id="ep-auth-status"></div>

<div class="pt-shell">
  <h1 class="pt-h1">Tool PES5</h1>
  <div class="pt-sub">Lee y edita el save de PES5 directo desde la carpeta del juego — equipos, plantillas, pedidos y publicación en un solo lugar.</div>
  <div id="gate"></div>
  <div id="app" style="display:none;">
    <div id="statusbar"></div>
    <div class="pt-tabs" id="tabs"></div>
    <div id="tabcontent"></div>
  </div>
</div>

<script src="pes5-tool.js"></script>
</body>
</html>
