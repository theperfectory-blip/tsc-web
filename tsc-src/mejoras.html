<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mejoras de jugadores · TSC</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/components.css">
<!-- Firebase (compat) — debe cargar antes de firebase-config.js / auth.js -->
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/state.js"></script>
<script src="js/db.js"></script>
<script src="js/events.js"></script>
<script src="js/auth.js"></script>
<!-- Slice D.R: reglas de costo compartidas con pes5-tool.html (modulo puro, sin DOM) -->
<script src="js/yunacoins-rules.js"></script>
<script src="js/pes5-plantilla.js"></script>
<script src="js/pes5-bloqueo.js"></script>
<link rel="stylesheet" href="css/mejoras-editor.css">
<link rel="stylesheet" href="css/mejoras-cambio.css">
<style>
/* Estilos de pagina del presidente (el editor en si: css/mejoras-editor.css) */
html,body{margin:0;background:var(--bg-deep);color:var(--txt);font-family:'Barlow',sans-serif;}
*{box-sizing:border-box;}
::-webkit-scrollbar{display:none;}
*{scrollbar-width:none;}
/* SAVE-1 · barra del save publicado (boton discreto con la fecha de la ultima subida) */
/* MEJUI-5 · save publicado: una linea corta con icono de descarga, al estilo de la cabecera.
   El aviso de hacer una copia del save propio va en el title del boton. */
.mej-save-pub{display:flex;align-items:center;justify-content:flex-end;gap:8px;max-width:1280px;margin:0 auto;
  padding:6px 14px 0;color:var(--txt2);font-family:'Barlow',sans-serif;}
.mej-save-pub[hidden]{display:none;}
.mej-save-pub .msp-btn{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 12px;
  border:1px solid var(--brd2);border-radius:10px;background:var(--card);color:var(--txt);
  font-size:12.5px;font-weight:500;letter-spacing:0.3px;text-decoration:none;cursor:pointer;}
.mej-save-pub .msp-btn:hover{border-color:var(--gold-b);color:var(--gold);}
.mej-save-pub .msp-empty{font-size:12px;color:var(--txt3);}
.mej-save-pub .icn{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
</style>
</head>
<body>
<div id="mej-save-pub" class="mej-save-pub" hidden></div>
<div id="mej-host"></div>
<script src="js/sanitize.js"></script>
<script src="js/save-publicado.js"></script>
<script src="js/mejoras-cambio.js"></script>
<script src="js/mejoras-page.js"></script>
</body>
</html>
